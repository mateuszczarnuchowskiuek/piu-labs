        <figure>
          <picture>

            />
          </picture>
          <figcaption>
            Słodkie przysmaki serwowane w trakcie podróży pociągiem RegioJet,

        <figure>

              alt="Mała płytka mikroprocesora z portem USB, umieszczona na niebieskim stole warsztatowym obok białej płytki stykowej."
            />
          </picture>
          <figcaption>
            Arduino Pro Micro, idealna, miniaturowa płytka do kompaktowych
            projektów DIY i prototypowania, często używana w niestandardowych
            kontrolerach.
          </figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="images/6_1000.jpg" media="(min-width: 1600px)" />

            />
          </picture>
          <figcaption>
            Jesienna dekoracja w miejskiej przestrzeni: efektowna kapusta
            ozdobna, wprowadzająca kolor i ciekawą teksturę do ogródka
            osiedlowego.
          </figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="images/12_1000.jpg" media="(min-width: 1600px)" />

              src="images/12_500.jpg"
              alt="Szeroka droga miejska z wieloma pasami ruchu, dwoma zatokami autobusowymi i dużą ilością zieleni wzdłuż pobocza."
            />
          </picture>
          <figcaption>
            Fragment trasy w Warszawie, przedstawiający skrzyżowanie nowoczesnej
            infrastruktury drogowej z zielonymi pasami buforowymi, kluczowy dla
            komunikacji autobusowej.
          </figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="images/2_1000.jpg" media="(min-width: 1600px)" />

            />
          </picture>
          <figcaption>
            Maczuga Herkulesa w Dolinie Prądnika, imponujący samotny ostaniec
            wapienny, wznoszący się nad parkingiem dla turystów.
          </figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="images/3_1000.jpg" media="(min-width: 1600px)" />

            />
          </picture>
          <figcaption>
            Zadra w Energylandii, imponujący rollercoaster hybrydowy, którego
            konstrukcja góruje nad krajobrazem, obiecując niezapomniane emocje.
          </figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="images/4_1000.jpg" media="(min-width: 1600px)" />
            <source srcset="images/4_500.jpg" media="(min-width: 1200px)" />

            <source srcset="images/4_500.jpg" media="(max-width: 799px)" />

              src="images/4_500.jpg"
              alt="Osiedlowa przestrzeń zielona z chodnikami i krzewami na pierwszym planie, w tle widoczne wysokie bloki mieszkalne."
            />
          </picture>
          <figcaption>
            Charakterystyczna zieleń osiedli Mistrzejowic, pełniąca funkcję
            rekreacyjną i ekologiczną, kluczowa dla jakości życia w blokach
            wielorodzinnych.
          </figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="images/10_1000.jpg" media="(min-width: 1600px)" />
            <source srcset="images/10_500.jpg" media="(min-width: 1200px)" />

            <source srcset="images/10_500.jpg" media="(max-width: 799px)" />
            <img
              src="images/10_500.jpg"
              alt="Panorama centrum Warszawy z Pałacem Kultury i Nauki oraz nowoczesnymi wieżowcami w tle, widoczna od strony ruchliwej ulicy."
            />
          </picture>
          <figcaption>
            Dynamiczny krajobraz serca Warszawy, ukazujący kontrast
            historycznego Pałacu Kultury i Nauki z nowoczesną, przeszkloną
            architekturą wieżowców biurowych.
          </figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="images/9_1000.jpg" media="(min-width: 1600px)" />
            <source srcset="images/9_500.jpg" media="(min-width: 1200px)" />
            <source srcset="images/9_1000.jpg" media="(min-width: 800px)" />
            <source srcset="images/9_500.jpg" media="(max-width: 799px)" />
            <img
              src="images/9_500.jpg"
              alt="Budynek Sejmu RP z charakterystyczną rotundą i flagą Polski na dachu, otoczony zielenią i strzeżony przez funkcjonariuszy."
            />
          </picture>
          <figcaption>
            Siedziba polskiego parlamentu, miejsce debat i stanowienia prawa,
            widoczna w pochmurny dzień, strzeżona przez służby porządkowe.
          </figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="images/7_1000.jpg" media="(min-width: 1600px)" />
            <source srcset="images/7_500.jpg" media="(min-width: 1200px)" />

            <source srcset="images/7_500.jpg" media="(max-width: 799px)" />
            <img
              src="images/7_500.jpg"
              alt="Pomnik konny z ciemnego brązu na wysokim, kamiennym cokole, na tle białego, neoklasycystycznego pałacu."
            />
          </picture>
          <figcaption>
            Pomnik Księcia Józefa Poniatowskiego na Krakowskim Przedmieściu,
            stojący przed Pałacem Prezydenckim, symbol polskiego patriotyzmu i
            historii wojskowości.
          </figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="images/8_1000.jpg" media="(min-width: 1600px)" />
            <source srcset="images/8_500.jpg" media="(min-width: 1200px)" />

            />
          </picture>
          <figcaption>
            Plac Zamkowy z Kolumną Zygmunta III Wazy, symbol historycznej
            Warszawy i popularny punkt spotkań turystów i mieszkańców stolicy.
          </figcaption>
        </figure>

            <source srcset="images/1_1000.jpg" media="(min-width: 1600px)" />

            Fontanna miejska, centralny punkt parku, zachęcający do odpoczynku
            na jednej z nowych drewnianych ławek.
